name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # Builds go to a private Dropbox folder, never to GitHub artifacts: in a public
  # repository any signed-in GitHub user can download those, and builds contain
  # the Gemini API key. Tag builds use the version as the folder name.
  DROPBOX_BUILDS_FOLDER: /WayfairFlatMaker builds/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.4.1"

      - name: Install dependencies
        run: poetry install --only main,build,windows-build --no-root

      - name: Create env file
        shell: bash
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build Windows app
        run: poetry run flet pack main.py --add-data "assets:assets" --add-data "locales:locales" --add-data ".env:." --add-data "pyproject.toml:." --icon assets/icon_windows.png --name WayfairFlatMakerByDK --yes

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath WayfairFlatMakerByDK-windows.zip

      # PowerShell, not Git Bash: Git Bash rewrites "/Folder" arguments into
      # Windows paths such as "C:/Program Files/Git/Folder".
      - name: Upload Windows app to Dropbox
        shell: pwsh
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python scripts/upload_to_dropbox.py WayfairFlatMakerByDK-windows.zip --folder "$env:DROPBOX_BUILDS_FOLDER"

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.4.1"

      - name: Install dependencies
        run: poetry install --only main,build --no-root

      - name: Create env file
        shell: bash
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build macOS app
        run: poetry run flet build --verbose --yes --no-rich-output --skip-flutter-doctor macos

      # ditto keeps the .app bundle intact: hidden folders such as Pillow's
      # .dylibs, symlinks, and executable permissions.
      - name: Package macOS app
        run: ditto -c -k --keepParent build/macos/*.app WayfairFlatMakerByDK-macos.zip

      - name: Upload macOS app to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python scripts/upload_to_dropbox.py WayfairFlatMakerByDK-macos.zip --folder "$DROPBOX_BUILDS_FOLDER"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          app_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $app_version"
            exit 1
          fi

      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## How to update

            1. Ask the administrator for the new version of the app.
            2. Close Wayfair Flat Maker.
            3. Replace the old app with the new one and start it again.
          generate_release_notes: true
