name: Build Wallpaper Sample Variants EXE

on:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openpyxl>=3.1.5,<4.0.0" "pyinstaller>=6.20.0,<7.0.0"

      - name: Build one-file executable
        run: |
          pyinstaller --onefile --clean --name add_wallpaper_sample_variants add_wallpaper_sample_variants.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: add_wallpaper_sample_variants-windows
          path: dist/add_wallpaper_sample_variants.exe
          if-no-files-found: error
          retention-days: 3
