name: Build Wallpaper Sample Variants EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-wallpaper-sample-variants-windows.yml
      - add_wallpaper_sample_variants.py
      - add_wallpaper_variants.py
      - data/**

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openpyxl>=3.1.5,<4.0.0" "pyinstaller>=6.20.0,<7.0.0"

      - name: Create bundled Dropbox config
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        shell: python
        run: |
          import os
          from pathlib import Path

          values = {
              "DROPBOX_TOKEN": os.environ.get("DROPBOX_TOKEN", ""),
              "DROPBOX_APP_KEY": os.environ.get("DROPBOX_APP_KEY", ""),
              "DROPBOX_APP_SECRET": os.environ.get("DROPBOX_APP_SECRET", ""),
              "DROPBOX_REFRESH_TOKEN": os.environ.get("DROPBOX_REFRESH_TOKEN", ""),
          }
          Path("dropbox_build_config.py").write_text(
              "\n".join(f"{key} = {value!r}" for key, value in values.items()) + "\n",
              encoding="utf-8",
          )

      - name: Build one-file executable
        run: |
          pyinstaller --onefile --clean --name add_wallpaper_sample_variants add_wallpaper_sample_variants.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: add_wallpaper_sample_variants-windows
          path: dist/add_wallpaper_sample_variants.exe
          if-no-files-found: error
          retention-days: 3
