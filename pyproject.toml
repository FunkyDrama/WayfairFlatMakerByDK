[project]
name = "wayfairflatmakerbydk"
version = "7.0.1"
description = "Desktop app that generates Wayfair bulk-upload spreadsheets for wall decals and wallpapers."
authors = [
    {name = "FunkyDrama",email = "cripswhigga18@gmail.com"}
]
license = {text = "No License"}
readme = "README.md"
requires-python = ">=3.12, <3.15"
keywords = ["wayfair", "spreadsheet", "listing", "ecommerce", "flet", "wallpaper", "wall decal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Natural Language :: Ukrainian",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Private :: Do Not Upload",
]
dependencies = [
    "watchdog (==4.0.0)",
    "flet (==1.0.5)",
    "babel (>=2.18.0,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "google-genai (>=2.8.0,<3.0.0)",
    "chardet (<6)",
    "pillow (>=12.2.0,<13.0.0)",
]

[project.urls]
Homepage = "https://github.com/FunkyDrama/WayfairFlatMakerByDK"
Repository = "https://github.com/FunkyDrama/WayfairFlatMakerByDK"
Issues = "https://github.com/FunkyDrama/WayfairFlatMakerByDK/issues"
Releases = "https://github.com/FunkyDrama/WayfairFlatMakerByDK/releases"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "pre-commit (>=4.0.0,<5.0.0)",
]
build = [
    "flet[all] (==1.0.5)"
]
windows-build = [
    "pyinstaller (>=6.20.0,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)"
]

[tool.flet]
product = "Wayfair Flat Maker by Daniel K"
artifact = "WayfairFlatMakerByDK"
company = "Daniel Kravchenko"
copyright = "Copyright (C) 2026 Daniel Kravchenko"
org = "com.funkydrama"
bundle_id = "com.funkydrama.wayfairflatmakerbydk"
build_number = 1

[tool.flet.app]
path = "."
module = "main.py"
exclude = [
    ".git",
    ".github",
    ".idea",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "scripts",
]
# Flet 1.0 no longer packages dot-files; the build bundles the AI key from .env.
include = [".env"]

# Shown while Python starts, before the app's language is known, so the text
# cannot be translated; the product name works in any language.
[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
spinner_size = 30
startup_message = "Wayfair Flat Maker"
fade_out_duration = 300

[tool.flet.macos]
target_arch = ["arm64"]

[tool.flet.macos.info]
LSApplicationCategoryType = "public.app-category.business"

[tool.flet.windows]
artifact = "WayfairFlatMakerByDK"

[tool.flet.flutter.pubspec.dependency_overrides]
connectivity_plus = "7.0.0"

[tool.ruff]
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
exclude = ["^build/", "^dist/"]

[tool.poetry]
package-mode = false

[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true
